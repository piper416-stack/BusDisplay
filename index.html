<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TTC Parkside & Algonquin Clock</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0f19;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      height: 100vh;
      padding: 0.6rem 1.4rem;
      user-select: none;
      overflow: hidden;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 2px solid #1f293d;
      padding-bottom: 0.4rem;
    }
    .stop-info h1 {
      font-size: 1.85rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.1;
    }
    .stop-info p {
      font-size: 0.95rem;
      color: #cbd5e1;
      margin-top: 0.15rem;
    }
    .weather {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      text-align: right;
    }
    .weather-icon {
      font-size: 4.5rem;
      line-height: 1;
    }
    .temp {
      font-size: 6.4rem;
      font-weight: 800;
      color: #7dd3fc;
      line-height: 0.9;
    }
    .weather-sub {
      font-size: 1rem;
      color: #cbd5e1;
      margin-top: 0.15rem;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 0;
    }
    .primary-arrival {
      font-size: 12.5rem;
      font-weight: 900;
      line-height: 0.85;
      color: #4ade80;
      text-shadow: 0 0 24px rgba(74, 222, 128, 0.35);
      letter-spacing: -5px;
      opacity: 1;
    }
    .primary-arrival.urgent { 
      color: #fbbf24;
      text-shadow: 0 0 24px rgba(251, 191, 36, 0.4);
    }
    .primary-unit {
      font-size: 1.15rem;
      color: #cbd5e1;
      font-weight: 600;
      margin-top: 0.25rem;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .subsequent-arrivals {
      display: flex;
      gap: 1rem;
      margin-top: 0.45rem;
      font-size: 1.1rem;
      color: #f1f5f9;
      background: #162032;
      padding: 0.28rem 1.1rem;
      border-radius: 999px;
    }
    .calendar-wrapper {
      border-top: 2px solid #1f293d;
      padding-top: 0.4rem;
      margin-bottom: 0.25rem;
      height: 7.1rem; /* Locked to 2 rows at doubled font height */
      overflow: hidden;
      position: relative;
      flex-shrink: 0;
    }
    .calendar-track {
      display: flex;
      flex-direction: column;
      transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1);
    }
    .cal-item {
      height: 3.3rem;
      display: flex;
      align-items: center;
      gap: 0.9rem;
      font-size: 2.2rem; /* Doubled from 1.1rem */
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .cal-time {
      background: #1e293b;
      color: #7dd3fc;
      font-weight: 700;
      padding: 0.15rem 0.75rem;
      border-radius: 8px;
      font-size: 1.85rem; /* Doubled from 0.95rem */
      flex-shrink: 0;
      line-height: 1.15;
    }
    .cal-title {
      color: #ffffff;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.15;
    }
    footer {
      display: flex;
      justify-content: space-between;
      color: #64748b;
      font-size: 0.85rem;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <header>
    <div class="stop-info">
      <h1>80 Queensway</h1>
      <p>Parkside Dr at Algonquin Ave (Stop #11774)</p>
    </div>
    <div class="weather">
      <div id="weather-icon" class="weather-icon">⛅</div>
      <div>
        <div id="temperature" class="temp">--°C</div>
        <div id="weather-desc" class="weather-sub">High Park</div>
      </div>
    </div>
  </header>

  <main>
    <div id="countdown" class="primary-arrival">--</div>
    <div id="unit-label" class="primary-unit">Minutes Until Next Bus</div>
    <div id="next-arrivals" class="subsequent-arrivals">Following buses: --</div>
  </main>

  <section class="calendar-wrapper">
    <div id="calendar-track" class="calendar-track">
      <div class="cal-item">
        <span class="cal-time">CALENDAR</span>
        <span class="cal-title">Loading upcoming schedule...</span>
      </div>
    </div>
  </section>

  <footer>
    <span id="clock">--:--</span>
    <span id="last-updated">Updating live data...</span>
  </footer>

  <script>
    // 1. Live Local Time Clock
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // Map WMO Weather Codes to clear icons and labels
    function getWeatherVisuals(code, isDay) {
      if (code === 0) return { icon: isDay ? '☀️' : '🌙', label: 'Clear' };
      if (code === 1 || code === 2) return { icon: isDay ? '🌤️' : '☁️', label: 'Partly Cloudy' };
      if (code === 3) return { icon: '☁️', label: 'Overcast' };
      if (code === 45 || code === 48) return { icon: '🌫️', label: 'Fog' };
      if ([51, 53, 55, 61, 63, 65, 80, 81, 82].includes(code)) return { icon: '🌧️', label: 'Rain' };
      if ([56, 57, 66, 67].includes(code)) return { icon: '🌨️', label: 'Freezing Rain' };
      if ([71, 73, 75, 77, 85, 86].includes(code)) return { icon: '❄️', label: 'Snow' };
      if ([95, 96, 99].includes(code)) return { icon: '⛈️', label: 'Thunderstorm' };
      return { icon: '🌡️', label: 'High Park' };
    }

    // 2. Fetch Open-Meteo Temperature & Weather Condition
    async function updateWeather() {
      try {
        const res = await fetch("https://api.open-meteo.com/v1/forecast?latitude=43.645&longitude=-79.462&current=temperature_2m,apparent_temperature,weather_code,is_day");
        const data = await res.json();
        const currentTemp = Math.round(data.current.temperature_2m);
        const feelsLike = Math.round(data.current.apparent_temperature);
        const weatherCode = data.current.weather_code;
        const isDay = data.current.is_day === 1;

        const visuals = getWeatherVisuals(weatherCode, isDay);

        document.getElementById('weather-icon').textContent = visuals.icon;
        document.getElementById('temperature').textContent = `${currentTemp}°C`;
        document.getElementById('weather-desc').textContent = `${visuals.label} • Feels ${feelsLike}°`;
      } catch (err) {
        document.getElementById('temperature').textContent = '--°C';
      }
    }

    // 3. Fetch Live TTC Arrivals from UmoIQ / NextBus feed
    async function updateTTC() {
      const stopId = "11774";
      const countdownEl = document.getElementById('countdown');
      const unitEl = document.getElementById('unit-label');
      const nextEl = document.getElementById('next-arrivals');
      const updateEl = document.getElementById('last-updated');

      try {
        const url = `https://retro.umoiq.com/service/publicJSONFeed?command=predictions&a=ttc&stopId=${stopId}`;
        const res = await fetch(url);
        const data = await res.json();

        let predictions = [];
        if (data.predictions && data.predictions.direction) {
          const dir = data.predictions.direction;
          const predList = Array.isArray(dir) ? dir[0].prediction : dir.prediction;
          if (Array.isArray(predList)) {
            predictions = predList.map(p => parseInt(p.minutes, 10));
          } else if (predList) {
            predictions = [parseInt(predList.minutes, 10)];
          }
        }

        if (predictions.length > 0) {
          const first = predictions[0];
          countdownEl.textContent = first;
          countdownEl.className = 'primary-arrival' + (first <= 3 ? ' urgent' : '');
          unitEl.textContent = first === 1 ? 'Minute Until Next Bus' : 'Minutes Until Next Bus';

          if (predictions.length > 1) {
            nextEl.style.display = 'block';
            nextEl.textContent = `Following buses in: ${predictions.slice(1).map(m => m + ' min').join(', ')}`;
          } else {
            nextEl.style.display = 'none';
          }
        } else {
          countdownEl.textContent = 'No Bus';
          unitEl.textContent = 'No upcoming arrivals scheduled';
          nextEl.style.display = 'none';
        }

        const now = new Date();
        updateEl.textContent = `Sync: ${now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
      } catch (err) {
        countdownEl.textContent = 'Err';
        unitEl.textContent = 'Check Network Connection';
      }
    }

    // 4. Calendar Fetching from Google Apps Script Web App (#cal=...)
    let scrollTimer = null;
    let totalEvents = 0;
    let currentIndex = 0;

    function startCalendarScroll() {
      if (scrollTimer) clearInterval(scrollTimer);
      const track = document.getElementById('calendar-track');
      currentIndex = 0;
      track.style.transform = 'translateY(0rem)';

      if (totalEvents <= 2) return;

      scrollTimer = setInterval(() => {
        currentIndex += 2;
        if (currentIndex >= totalEvents) {
          currentIndex = 0;
        }
        // Each .cal-item is 3.3rem tall
        track.style.transform = `translateY(-${currentIndex * 3.3}rem)`;
      }, 5000);
    }

    async function updateCalendar() {
      const calTrack = document.getElementById('calendar-track');
      const hashParams = new URLSearchParams(window.location.hash.substring(1));
      const calUrl = hashParams.get('cal') || hashParams.get('ical');

      if (!calUrl) {
        totalEvents = 0;
        calTrack.innerHTML = `
          <div class="cal-item">
            <span class="cal-time">SETUP</span>
            <span class="cal-title">Append #cal=YOUR_APPS_SCRIPT_URL to Start URL</span>
          </div>`;
        return;
      }

      try {
        const res = await fetch(calUrl);
        const events = await res.json();
        const now = new Date();
        totalEvents = events.length;

        if (totalEvents === 0) {
          calTrack.innerHTML = `
            <div class="cal-item">
              <span class="cal-time">CLEAR</span>
              <span class="cal-title">No upcoming events in the next 48 hours</span>
            </div>`;
          return;
        }

        const renderedItems = events.map(ev => {
          const start = new Date(ev.start);
          const isToday = start.toDateString() === now.toDateString();
          const dayPrefix = isToday ? '' : start.toLocaleDateString([], { weekday: 'short' }) + ' ';
          const timeStr = ev.isAllDay
            ? `${dayPrefix}All Day`
            : `${dayPrefix}${start.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}`;
          return `
            <div class="cal-item">
              <span class="cal-time">${timeStr}</span>
              <span class="cal-title">${ev.title || '(Busy)'}</span>
            </div>`;
        });

        if (totalEvents > 2 && totalEvents % 2 !== 0) {
          renderedItems.push(`<div class="cal-item"></div>`);
        }

        calTrack.innerHTML = renderedItems.join('');
        startCalendarScroll();

      } catch (err) {
        totalEvents = 0;
        calTrack.innerHTML = `
          <div class="cal-item">
            <span class="cal-time">CAL ERR</span>
            <span class="cal-title">Unable to reach Apps Script (${err.message})</span>
          </div>`;
      }
    }

    // Polling Intervals
    updateWeather();
    updateTTC();
    updateCalendar();
    setInterval(updateWeather, 10 * 60 * 1000);
    setInterval(updateTTC, 30 * 1000);
    setInterval(updateCalendar, 10 * 60 * 1000);
  </script>
</body>
</html>
